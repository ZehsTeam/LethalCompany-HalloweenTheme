[config]
schemaVersion = "0.0.1"

[package]
namespace = "Zehs"
name = "HalloweenTheme"
description = "[v81] Reskin mod for vanilla moons, enemies, scrap, and equipment to make them more spooky. (11 moons, 1 enemy, 37 scrap, 2 equipment)"
websiteUrl = "https://github.com/ZehsTeam/LethalCompany-HalloweenTheme"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Evaisa-FixPluginTypesSerialization = "1.1.1"

[build]
icon = "./icon.png"
readme = "../../README.md"
outdir = "./Packages"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../HalloweenTheme/bin/Release/netstandard2.1/com.github.zehsteam.HalloweenTheme.dll"
target = "BepInEx/plugins/"

[[build.copy]]
source = "../../HalloweenTheme/bin/Release/netstandard2.1/halloweentheme_assets"
target = "BepInEx/plugins/"
